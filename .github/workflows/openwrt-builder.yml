name: OpenWrt Builder

on:
  schedule:
  # 定时触发工作流，使用 UTC 时间。这里设置为每月 16 日 19:00 触发。
  - cron: 0 19 16 * *
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否启用 SSH 连接到 Actions'
        required: false
        default: 'false'
#       configfile:
#         description: 'OpenWRT Make Menuconfig 的配置文件'
#         required: true
#         default: $CONFIG_FILE

env:
  # 定义环境变量
  REPO_URL: https://github.com/coolsnowwolf/lede  # OpenWrt 源码仓库地址
  REPO_BRANCH: master                             # 使用的分支
  FEEDS_CONF: feeds.conf.default                  # feeds 配置文件
  CONFIG_FILE: x86_64_v20240317.config            # 自定义配置文件
  DIY_P1_SH: diy-part1.sh                         # 自定义脚本 Part 1
  DIY_P2_SH: diy-part2.sh                         # 自定义脚本 Part 2
  UPLOAD_BIN_DIR: false                           # 是否上传 bin 目录
  UPLOAD_FIRMWARE: true                           # 是否上传固件
  UPLOAD_RELEASE: true                            # 是否发布 Release
  TZ: Asia/Shanghai                               # 设置时区为上海

jobs:
  build:
    runs-on: ubuntu-24.04                         # 使用 Ubuntu 22.04 作为运行环境
    permissions:
      contents: write                             # 修复上传固件到 Release 时的权限问题

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master   # 扩大构建空间
      with:
        root-reserve-mb: 6144                     # 保留 6GB 空间
        swap-size-mb: 10240                       # 创建 10GB 的交换空间             
        remove-dotnet: 'true'                     # 删除 .NET SDK
        remove-android: 'true'                    # 删除 Android SDK
        remove-haskell: 'true'                    # 删除 Haskell SDK 
        remove-codeql: 'true'                     # 删除 CodeQL
        remove-docker-images: 'true'              # 删除 Docker 镜像
        build-mount-path: '/workdir'              # 设置工作目录为 /workdir

    - name: Checkout
      uses: actions/checkout@main                # 检出代码仓库

    - name: Disk space check
      run: |
           echo "Free space:"
           df -h  

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive          # 设置非交互式模式
      run: |
        # 初始化环境，清理不必要的文件和安装依赖
        # sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        # sudo docker image prune --all --force
        # sudo -E apt-get -qq update
        # sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        # sudo -E apt-get -qq autoremove --purge
        # sudo -E apt-get -qq clean
        # sudo timedatectl set-timezone "$TZ"
        # sudo mkdir -p /workdir
        # sudo chown $USER:$GROUPS /workdir
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        # 克隆 OpenWrt 源码到工作目录
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true' #'true' 默认值
        #清空缓存
        clean:  'false'  # 'false' 默认值
        prefix: ${{ github.workspace }}/openwrt

    - name: luci-app-openclash install
      run: |
        cd openwrt
        mkdir package/luci-app-openclash
        cd package/luci-app-openclash
        git init
        git remote add -f origin https://github.com/vernesong/OpenClash.git
        git config core.sparsecheckout true
        echo "luci-app-openclash" >> .git/info/sparse-checkout
        git pull --depth 1 origin master
        git branch --set-upstream-to=origin/master 


    - name: Load custom feeds
      run: |
        # 加载自定义 feeds 配置
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a  # 更新 feeds

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a # 安装 feeds

    - name: Load custom configuration
      run: |
        # 加载自定义配置文件和脚本
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # 配置 SSH 连接到 Actions

    - name: Download package
      id: package
      run: |
        # 下载编译所需的依赖包
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config #Cache.Speedup
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        # 编译固件
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        df -h
        echo "=================================="
        du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
        du -h --max-depth=1 ./build_dir
        du -h --max-depth=1 ./bin

    - name: Check space usage
      if: (!cancelled())
      run: df -hT  # 检查磁盘空间使用情况

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin  # 上传 bin 目录

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        # 整理固件文件
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}  # 上传固件目录

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        # 生成 Release 标签
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*  # 上传固件到 Release

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2  # 删除旧的工作流运行记录

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true  # 删除旧的 Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
